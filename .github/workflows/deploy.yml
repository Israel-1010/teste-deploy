name: Build Teste Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: docker build -t teste-deploy:latest .

      - name: Tag
        run: docker tag teste-deploy:latest registry.clubepaineiras.com.br/teste-deploy:latest

      - name: Push
        run: docker push registry.clubepaineiras.com.br/teste-deploy:latest